[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dphf"
version = "0.1.0"
description = "DPHF model implementation for robotic network intrusion detection"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Ting Su"}, {name = "Yutian Feng"}, {name = "Jingyi Xu"}, {name = "Jiazhong Lu"}]
dependencies = ["torch>=2.1,<3", "numpy>=1.26,<3"]

[project.urls]
Repository = "https://github.com/0xMarch-food/DPHF"

[tool.setuptools.packages.find]
where = ["src"]
